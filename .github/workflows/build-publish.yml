name: Build and Publish Docker Image

env:
  DOCKER_USERNAME: finos
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Release gate: release/** builds (the only ones that publish the Docker image) must pass
  # the license scan first. Only the released project is scanned here; the full repository is
  # scanned by license-scanning.yml itself on PRs, pushes to main and the weekly schedule, so the
  # reusable call is skipped on main and main builds are not blocked.
  license-check:
    name: License Check
    if: startsWith(github.ref, 'refs/heads/release/')
    uses: ./.github/workflows/license-scanning.yml
    with:
      maven-projects: fluxnova-springboot-example
      npm: 'false'

  build-and-publish:
    needs: license-check
    # Run when license-check succeeded (release/**) or was skipped (main); never after a failure.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Java setup
        uses: ./.github/actions/java-setup

      - name: Configure git
        uses: ./.github/actions/configure-git

      - name: Collect Workflow Telemetry
        uses: catchpoint/workflow-telemetry-action@v2
        with:
          theme: dark

      - name: Build with Maven
        run: mvn clean install -f fluxnova-springboot-example/pom.xml

      - name: Extract version from branch
        id: version
        if: startsWith(github.ref, 'refs/heads/release/')
        run: |
          VERSION="${GITHUB_REF#refs/heads/release/}"
          echo "release_tag=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and publish Docker image
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: ./.github/actions/build-publish-image
        with:
          image_name: finos/fluxnova-springboot-demo
          dockerfile_path: fluxnova-springboot-example/Dockerfile
          docker_context: .
          release_tag: ${{ steps.version.outputs.release_tag }}
